# Built on its own, 32-bit (the game is x86): see README.md. Not part of the main workspace.
[workspace]

[package]
name = "ts_harness"
version = "0.1.0"
edition = "2021"
description = "Checking harness (row F9): runs inside a copy of the original game and calls its methods through the il2cpp C API"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Memory",
    "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }
